name: Release

on:
  push:
    branches: [main]
    paths: [package.json, CHANGELOG.md]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - name: Tag and publish the CHANGELOG's newest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="$RUNNER_TEMP/notes.md"
          VERSION="$(bun scripts/release-notes.ts "$NOTES")"
          PKG_VERSION="$(node -p 'require("./package.json").version')"
          if [ -z "$VERSION" ]; then
            echo "CHANGELOG.md has no released section yet; nothing to release."
            exit 0
          fi
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "CHANGELOG.md's newest release is $VERSION but package.json is $PKG_VERSION."
            exit 1
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION is already released."
            exit 0
          fi
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file "$NOTES"
