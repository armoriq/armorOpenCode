[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "armor-opencode"
version = "0.1.0"
description = "Local, read-only OpenCode token and tool telemetry"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "ArmorIQ"}]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
armor-opencode = "armor_opencode.__main__:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["armor_opencode*"]

[tool.setuptools.exclude-package-data]
"*" = ["*"]
