[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "armor-opencode"
version = "0.1.0"
description = "Local, read-only OpenCode token and tool telemetry"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
armor-opencode = "armor_opencode.__main__:main"

[tool.setuptools.packages.find]
include = ["armor_opencode*"]
